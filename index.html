
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f6fb;
    }

    main {
      max-width: 560px;
      margin: 24px;
      padding: 48px 36px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 36px #1f29371a;
    }

    h1 {
      margin-top: 0;
      color: #2563eb;
    }

    p {
      line-height: 1.6;
      color: #526071;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      background: #2563eb;
      border-radius: 8px;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to My Website</h1>
    <p>A simple place to share your ideas, projects, and updates.</p>
    <a href="mailto:hello@example.com">Get in touch</a>
  </main>
</body>
</html>
